name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout hnf (path dep)
        run: |
          git clone --depth 1 file://${{ github.workspace }}/../hnf /tmp/hnf 2>/dev/null || true
      - run: cargo test --all
        continue-on-error: true
